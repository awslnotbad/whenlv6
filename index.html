<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili Lv6等级 计算器</title>
    <style>
        :root {
            --bili-pink: #fb7299;
            --bili-pink-hover: #f95d8a;
            --text-primary: #333;
            --text-secondary: #666;
            --bg-page: #f5f7fa;
            --bg-card: #ffffff;
            --border-radius: 12px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: clamp(12px, 3vw, 24px);
            background-image: url('https://api.paugram.com/wallpaper/?source=gh');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(245, 247, 250, 0.85);
            z-index: -1;
        }

        #sakura-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 2;
            background: var(--bg-card);
            width: min(90vw, 480px);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: clamp(16px, 4vw, 28px);
            animation: fadeIn 0.5s ease-out;
            margin-top: clamp(8px, 2vw, 16px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: var(--bili-pink);
            margin-bottom: 0.3em;
            font-size: clamp(1.3rem, 4vw, 1.8rem);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: clamp(1em, 3vw, 1.8em);
            font-size: clamp(0.8rem, 2.5vw, 0.95rem);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: clamp(6px, 1.5vw, 12px);
        }

        .form-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(6px, 1.5vw, 10px) 0;
            border-bottom: 1px solid #f0f0f0;
            gap: clamp(8px, 2vw, 16px);
            flex-wrap: wrap;
        }

        .form-item:last-child { border-bottom: none; }

        .form-label {
            font-size: clamp(0.85rem, 2.5vw, 0.95rem);
            color: var(--text-primary);
            font-weight: 500;
            flex-shrink: 0;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-wrapper input {
            margin-right: clamp(4px, 1vw, 8px);
            accent-color: var(--bili-pink);
            width: clamp(14px, 3.5vw, 18px);
            height: clamp(14px, 3.5vw, 18px);
            cursor: pointer;
        }

        select, input[type="text"], input[type="number"] {
            padding: clamp(5px, 1.5vw, 8px) clamp(8px, 2vw, 12px);
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            background-color: #fff;
            transition: all 0.2s;
            width: clamp(90px, 25vw, 120px);
            min-width: 0;
        }

        select:focus, input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--bili-pink);
            box-shadow: 0 0 0 2px rgba(251, 114, 153, 0.2);
        }

        .result-box {
            margin-top: clamp(1em, 3vw, 1.8em);
            text-align: center;
            padding: clamp(0.8em, 2.5vw, 1.5em);
            background-color: #fff0f3;
            border-radius: var(--border-radius);
            border: 1px dashed var(--bili-pink);
        }

        .result-label {
            font-size: clamp(0.8rem, 2.5vw, 0.9rem);
            color: var(--text-secondary);
            margin-bottom: 0.3em;
        }

        .result-value {
            font-size: clamp(2rem, 7vw, 3rem);
            font-weight: 800;
            color: var(--bili-pink);
            line-height: 1;
        }

        .result-unit {
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            color: var(--text-secondary);
            font-weight: normal;
        }

        .footer {
            margin-top: clamp(1em, 3vw, 1.8em);
            text-align: center;
            font-size: clamp(0.7rem, 2vw, 0.8rem);
            color: #999;
        }

        .footer a {
            color: var(--bili-pink);
            text-decoration: none;
        }

        /* 超小屏兜底：确保表单项不会挤在一起 */
        @media (max-width: 360px) {
            .form-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            select, input[type="text"], input[type="number"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <canvas id="sakura-canvas"></canvas>

    <div class="card">
        <h1>🌸 Lv6 计算器</h1>
        <p class="subtitle">计算距离成为 Bilibili Lv6 大佬还有多少天</p>
        <div class="form-group">
            <div class="form-item">
                <label class="form-label">每日登录 (+5)</label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="checkLogin" checked> 开启
                </label>
            </div>
            <div class="form-item">
                <label class="form-label">每日观看 (+5)</label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="checkWatch" checked> 开启
                </label>
            </div>
            <div class="form-item">
                <label class="form-label">每日分享 (+5)</label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="checkShare"> 开启
                </label>
            </div>
            <div class="form-item">
                <label class="form-label">风纪委员 (+30/月)</label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="checkJudge"> 开启
                </label>
            </div>
            <div class="form-item">
                <label class="form-label">每日投币</label>
                <select id="selectCoin">
                    <option value="0">每天白嫖</option>
                    <option value="1">每天一币</option>
                    <option value="2" selected>每天两币</option>
                    <option value="3">每天三币</option>
                    <option value="4">每天四币</option>
                    <option value="5">每天五币</option>
                </select>
            </div>
            <div class="form-item">
                <label class="form-label">当前硬币</label>
                <input type="number" id="inputCoin" value="10" placeholder="硬币数">
            </div>
            <div class="form-item">
                <label class="form-label">当前经验</label>
                <input type="number" id="inputExp" value="0" placeholder="经验值">
            </div>
            <div class="form-item">
                <label class="form-label">目标经验</label>
                <input type="number" id="inputTarget" value="28800" placeholder="Lv6经验">
            </div>
        </div>
        <div class="result-box">
            <div class="result-label">预计还需要</div>
            <div>
                <span class="result-value" id="resultDays">0</span>
                <span class="result-unit">天</span>
            </div>
        </div>
        <div class="footer">
            <p> <a href="https://icp.gov.moe/?keyword=20217478" target="_blank"> 🍭 萌ICP备20217478号 </a> </p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Sakura {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 15 + 10;
                this.speed = Math.random() * 2 + 1;
                this.wind = Math.random() * 2 - 1;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
            }
            update() {
                this.y += this.speed;
                this.x += this.wind;
                this.rotation += this.rotationSpeed;
                if (this.y > height) { this.reset(); this.y = -20; }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = '#ffb7c5';
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles(num) {
            particles = [];
            for (let i = 0; i < num; i++) particles.push(new Sakura());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        initParticles(30);
        animate();

        const checkLogin = document.getElementById('checkLogin');
        const checkWatch = document.getElementById('checkWatch');
        const checkShare = document.getElementById('checkShare');
        const checkJudge = document.getElementById('checkJudge');
        const selectCoin = document.getElementById('selectCoin');
        const inputCoin = document.getElementById('inputCoin');
        const inputExp = document.getElementById('inputExp');
        const inputTarget = document.getElementById('inputTarget');
        const resultDays = document.getElementById('resultDays');

        function calculate() {
            let dailyExp = 0;
            if (checkLogin.checked) dailyExp += 5;
            if (checkWatch.checked) dailyExp += 5;
            if (checkShare.checked) dailyExp += 5;
            if (checkJudge.checked) dailyExp += 1;
            dailyExp += parseInt(selectCoin.value);

            const currentExp = parseInt(inputExp.value) || 0;
            const targetExp = parseInt(inputTarget.value) || 0;
            const remainingExp = targetExp - currentExp;

            if (remainingExp <= 0) { resultDays.innerText = "0"; return; }
            if (dailyExp <= 0) { resultDays.innerText = "∞"; return; }

            resultDays.innerText = Math.ceil(remainingExp / dailyExp);
        }

        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('input', calculate);
            el.addEventListener('change', calculate);
        });

        calculate();
    </script>
</body>
</html>
